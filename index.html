<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>20290529 New No-Heading Shadowing Player</title>
  <style>
    :root {
      --bg: #f3efe8;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --text: #1d1a17;
      --muted: #6d655d;
      --line: rgba(67, 50, 32, 0.12);
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.11);
      --active: #c2410c;
      --active-soft: rgba(194, 65, 12, 0.1);
      --shadow: 0 20px 60px rgba(42, 28, 14, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      color: var(--text);
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.08), transparent 30%),
        radial-gradient(circle at top right, rgba(194, 65, 12, 0.08), transparent 28%),
        linear-gradient(180deg, #faf7f1 0%, var(--bg) 100%);
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    .hero {
      display: grid;
      gap: 20px;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      min-width: 0;
    }

    .now-playing {
      padding: 28px 28px 26px;
      min-height: 390px;
      display: grid;
      gap: 22px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 50px);
      line-height: 1.02;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 60ch;
      overflow-wrap: anywhere;
    }

    .current-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      min-width: 0;
    }
